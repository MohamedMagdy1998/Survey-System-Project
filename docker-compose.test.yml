# ==============================================================================
# Survey System Project - Testing Environment Override
# Strict dependency enforcement, automated healthchecks, and isolated test ports.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.testing up -d
# ==============================================================================

services:
  sqlserver:
    ports:
      - "${SQLSERVER_PORT:-1434}:1433"
    restart: "no"

  seq:
    ports:
      - "${SEQ_PORT:-5342}:80"
    restart: "no"

  api:
    ports:
      - "${API_HTTP_PORT:-8081}:8080"
    restart: "no"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "dotnet --version > /dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
