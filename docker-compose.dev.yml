# ==============================================================================
# Survey System Project - Development Environment Override
# Exposes ports for host debugging, mounts local log volumes, and enables dev features.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.development up -d
# ==============================================================================

services:
  sqlserver:
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    restart: on-failure

  seq:
    ports:
      - "${SEQ_PORT:-5341}:80"
    restart: on-failure

  api:
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Logs:/app/Logs
    restart: on-failure
