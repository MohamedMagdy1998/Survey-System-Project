# ==============================================================================
# Survey System Project - Base Docker Compose Specification (DRY Base)
# Shared infrastructure: networks, persistent volumes, base service schemas.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Microsoft SQL Server Database Engine
  # ----------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: survey-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD must be provided}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - survey-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Database Provisioner / Initializer
  # Ensures SurveyDB and SurveyBasketJobs exist automatically before API starts
  # ----------------------------------------------------------------------------
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: survey-db-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - survey-network
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD must be provided}
      DB_NAME: ${DB_NAME:-SurveyDB}
      HANGFIRE_DB_NAME: ${HANGFIRE_DB_NAME:-SurveyBasketJobs}
    entrypoint: >
      /bin/bash -c "
      echo 'Provisioning databases [$$DB_NAME] and [$$HANGFIRE_DB_NAME]...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$SA_PASSWORD\" -C -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$DB_NAME') CREATE DATABASE [$$DB_NAME]; IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$HANGFIRE_DB_NAME') CREATE DATABASE [$$HANGFIRE_DB_NAME];\" || \
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$SA_PASSWORD\" -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$DB_NAME') CREATE DATABASE [$$DB_NAME]; IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$HANGFIRE_DB_NAME') CREATE DATABASE [$$HANGFIRE_DB_NAME];\"
      echo 'Databases initialized successfully.';
      "

  # ----------------------------------------------------------------------------
  # Seq Centralized Structured Logging & Ingestion
  # ----------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: survey-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    networks:
      - survey-network

  # ----------------------------------------------------------------------------
  # Survey System Web API Service (.NET 8)
  # ----------------------------------------------------------------------------
  api:
    image: ${IMAGE_NAME:-survey-system-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION_STRING:?DEFAULT_CONNECTION_STRING is required}
      ConnectionStrings__HangfireConnection: ${HANGFIRE_CONNECTION_STRING:?HANGFIRE_CONNECTION_STRING is required}
      Serilog__WriteTo__2__Args__serverUrl: ${SEQ_SERVER_URL:-http://seq:5341}
      Serilog__WriteTo__1__Args__path: ${LOG_FILE_PATH:-/app/Logs/Log-.txt}
      JwtSettings__Key: ${JWT_KEY:?JWT_KEY must be provided}
      JwtSettings__Issuer: ${JWT_ISSUER:-SurveyBasketApp}
      JwtSettings__Audience: ${JWT_AUDIENCE:-SurveyBasketApp users}
      JwtSettings__ExpiryInMinutes: ${JWT_EXPIRY_IN_MINUTES:-30}
      MailSettings__Mail: ${MAIL_ADDRESS:-oceane.gleichner96@ethereal.email}
      MailSettings__DisplayName: ${MAIL_DISPLAY_NAME:-Survey Basket}
      MailSettings__Password: ${MAIL_PASSWORD:-}
      MailSettings__Host: ${MAIL_HOST:-smtp.ethereal.email}
      MailSettings__Port: ${MAIL_PORT:-587}
      MyRateLimit__PermitLimit: ${RATE_LIMIT_PERMIT:-1000}
      MyRateLimit__QueueLimit: ${RATE_LIMIT_QUEUE:-100}
      AllowedOrigins__0: ${ALLOWED_ORIGIN:-https://www.survey-basket.com}
    volumes:
      - api_logs:/app/Logs
    networks:
      - survey-network

networks:
  survey-network:
    name: survey-network
    driver: bridge

volumes:
  sqlserver_data:
    name: survey_sqlserver_data
  seq_data:
    name: survey_seq_data
  api_logs:
    name: survey_api_logs
