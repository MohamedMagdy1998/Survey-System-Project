# ==============================================================================
# Survey System Project - Production Environment Override
# Production hardening: resource quotas, network isolation, log rotation & restart policies.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d
# ==============================================================================

services:
  sqlserver:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-network

  db-init:
    networks:
      - backend-network

  seq:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-network

  api:
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-network
      - frontend-network

networks:
  backend-network:
    name: survey_prod_backend_network
    internal: true
  frontend-network:
    name: survey_prod_frontend_network
