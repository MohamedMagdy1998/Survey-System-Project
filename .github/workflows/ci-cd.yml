name: CI/CD Pipeline & Docker Hub Deployment

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Code Quality
  # ----------------------------------------------------------------------------
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (8.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Project Dependencies
        run: dotnet restore "API Layer/API Layer.csproj"

      - name: Build Solution (Release)
        run: dotnet build "API Layer/API Layer.csproj" --configuration Release --no-restore

      - name: Run Domain Unit Tests
        run: dotnet test "Domain.UnitTests/Domain.UnitTests.csproj" --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults/Domain

      - name: Run Application Unit Tests
        run: dotnet test "Application.UnitTests/Application.UnitTests.csproj" --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults/Application

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults

  # ----------------------------------------------------------------------------
  # Job 2: Validate Docker Compose Configurations across all 3 environments
  # ----------------------------------------------------------------------------
  validate-compose:
    name: Validate Docker Compose Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Development Compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.development config --quiet

      - name: Validate Testing Compose
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.testing config --quiet

      - name: Validate Production Compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production config --quiet

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Production Docker Image to Docker Hub
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, validate-compose]
    # Only push on main/master branch pushes or tag releases or manual dispatch
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'mohamedmagdy1998' }}/survey-system-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
